name: Jarvis Import

on:
  schedule:
    # Co godzinę o :00 UTC (np. 09:00, 10:00… czasu polskiego latem)
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      import_all:
        description: "Importuj wszystko od początku (ignoruje pole „dni”)"
        type: boolean
        required: false
        default: false
      days:
        description: "Ile dni wstecz importować"
        required: false
        default: "7"
      skip_modules:
        description: "Pomiń moduły (np. silownia,cialo)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: jarvis-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    defaults:
      run:
        working-directory: Scripts/import

    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPENSCALE_DRIVE_FILE_ID: ${{ secrets.OPENSCALE_DRIVE_FILE_ID }}
      OPENSCALE_DRIVE_FOLDER_ID: ${{ secrets.OPENSCALE_DRIVE_FOLDER_ID }}
      GOOGLE_CREDENTIALS_FILE: google-service-account.json
      GARMIN_TOKEN_DIR: .garminconnect
      DEFAULT_DAYS: "3"
      IMPORT_START_DATE: "2026-07-09"
      TIMEZONE: "Europe/Warsaw"
      REQUEST_DELAY_SEC: "0.4"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Scripts/import/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Przygotuj Google Service Account
        run: printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > google-service-account.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Przygotuj tokeny Garmin
        run: |
          python - <<'PY'
          import base64, os, zipfile, io
          from pathlib import Path
          raw = os.environ.get("GARMINCONNECT_ZIP", "")
          if not raw:
              print("Brak GARMINCONNECT_ZIP — moduły Garmin mogą wymagać ponownego logowania.")
              raise SystemExit(0)
          data = base64.b64decode(raw)
          Path(".garminconnect").mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(data)) as zf:
              zf.extractall(".garminconnect")
          print("Tokeny Garmin rozpakowane.")
          PY
        env:
          GARMINCONNECT_ZIP: ${{ secrets.GARMINCONNECT_ZIP }}

      - name: Uruchom import
        run: |
          SKIP="${{ github.event.inputs.skip_modules || '' }}"
          if [ "${{ github.event.inputs.import_all }}" = "true" ]; then
            echo "Tryb: pełny import od ${IMPORT_START_DATE}"
            ARGS=(--no-prompt --all)
          else
            DAYS="${{ github.event.inputs.days || env.DEFAULT_DAYS }}"
            ARGS=(--no-prompt --days "$DAYS")
          fi
          if [ -n "$SKIP" ]; then
            ARGS+=(--skip "$SKIP")
          fi
          python -m jarvis_import "${ARGS[@]}"

      - name: Wrzuć backup openScale do inspekcji
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openscale-inspect
          path: |
            /tmp/jarvis-import/openScale_backup.zip
            /tmp/jarvis-import/openScale.db_auto_backup.zip
            /tmp/jarvis-import/cialo-measurements.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Podsumowanie (bez sekretów)
        if: always()
        run: echo "Workflow zakończony — sprawdź logi powyżej."
